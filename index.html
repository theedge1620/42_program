<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>42 Day Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ── Reset & Variables ─────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #060a14;
    --surface:   #0d1424;
    --surface2:  #131d30;
    --border:    #1a2540;
    --border2:   #243252;
    --text:      #e2e8f4;
    --muted:     #4a5d7e;
    --muted2:    #2d3f5c;
    --accent:    #e8820c;
    --accent-lo: #e8820c18;
    --blue:      #3b8ef0;
    --blue-lo:   #3b8ef018;
    --green:     #22c97a;
    --green-lo:  #22c97a18;
    --amber:     #f5b731;
    --amber-lo:  #f5b73118;
    --purple:    #a78bfa;
    --purple-lo: #a78bfa18;
    --red:       #f05252;
    --mono:      'Fira Code', monospace;
    --sans:      'Syne', sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Subtle grid texture */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.18;
    pointer-events: none;
  }

  /* ── Layout ────────────────────────────────────────────── */
  #root { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 0 16px 60px; }

  /* ── Topbar ────────────────────────────────────────────── */
  #topbar {
    position: sticky; top: 0; z-index: 200;
    background: rgba(6,10,20,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
  }
  #topbar-inner {
    max-width: 960px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    height: 58px;
  }
  .logo {
    display: flex; align-items: baseline; gap: 10px;
  }
  .logo-title {
    font-size: 20px; font-weight: 800; letter-spacing: -0.5px; color: var(--text);
  }
  .logo-sub {
    font-family: var(--mono); font-size: 10px;
    color: var(--accent); letter-spacing: 2.5px;
  }
  .topbar-right {
    display: flex; align-items: center; gap: 20px;
  }
  .total-score {
    font-family: var(--mono); font-size: 12px; color: var(--muted);
  }
  .total-score span { color: var(--text); font-weight: 600; }
  #save-status {
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 1.5px; color: var(--green);
    transition: color 0.3s;
  }
  #save-status.saving { color: var(--accent); }

  #export-btn {
    font-family: var(--mono); font-size: 10px; letter-spacing: 1px;
    color: var(--blue); background: var(--blue-lo);
    border: 1px solid var(--blue); border-radius: 6px;
    padding: 5px 12px; cursor: pointer; outline: none;
    transition: all 0.15s;
  }
  #export-btn:hover { background: #3b8ef030; }

  /* ── Cards ─────────────────────────────────────────────── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 16px;
    animation: fadeIn 0.3s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Overview card ─────────────────────────────────────── */
  #overview-card { padding: 18px 20px; margin-top: 20px; }
  .section-label {
    font-family: var(--mono); font-size: 10px;
    color: var(--muted); letter-spacing: 2.5px;
    margin-bottom: 14px;
  }
  .overview-grid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px;
  }
  .ov-week { text-align: center; }
  .ov-bar-track {
    height: 5px; background: var(--surface2); border-radius: 3px;
    overflow: hidden; margin-bottom: 5px;
  }
  .ov-bar-fill {
    height: 100%; border-radius: 3px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }
  .ov-label { font-family: var(--mono); font-size: 9px; color: var(--muted2); letter-spacing: 1px; }
  .ov-score { font-family: var(--mono); font-size: 12px; font-weight: 600; margin-top: 2px; }

  /* ── Legend card ───────────────────────────────────────── */
  #legend-card { padding: 14px 20px; }
  .legend-inner {
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 6px;
  }
  .legend-dot {
    width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0;
  }
  .legend-key {
    font-family: var(--mono); font-size: 10px; color: var(--muted); font-weight: 600;
  }
  .legend-desc { font-family: var(--mono); font-size: 9px; color: var(--muted2); }
  .legend-pts {
    margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--muted2);
    white-space: nowrap;
  }

  /* ── Week tabs ─────────────────────────────────────────── */
  #week-tabs {
    display: flex; gap: 6px; margin: 16px 0;
    overflow-x: auto; padding-bottom: 2px;
  }
  #week-tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0; padding: 7px 16px;
    border-radius: 7px; cursor: pointer;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--muted); font-family: var(--mono);
    font-size: 11px; font-weight: 600;
    transition: all 0.15s; outline: none;
    letter-spacing: 0.5px;
  }
  .tab:hover { border-color: var(--border2); color: var(--text); }
  .tab.active-week {
    border-color: var(--accent);
    background: var(--accent-lo);
    color: var(--accent);
  }
  .tab.active-all {
    border-color: var(--blue);
    background: var(--blue-lo);
    color: var(--blue);
  }
  .tab-score { margin-left: 6px; opacity: 0.7; }

  /* ── Week card header ──────────────────────────────────── */
  .week-header {
    background: var(--surface2);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 20px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .week-label-block { flex-shrink: 0; }
  .week-num {
    font-family: var(--mono); font-size: 10px;
    color: var(--accent); letter-spacing: 2px; margin-bottom: 3px;
  }
  .week-date {
    font-family: var(--sans); font-weight: 700; font-size: 17px; color: var(--text);
  }
  .score-bar-wrap { flex: 1; min-width: 160px; }
  .score-bar-labels {
    display: flex; justify-content: space-between;
    font-family: var(--mono); font-size: 10px; color: var(--muted); margin-bottom: 5px;
  }
  .score-bar-labels .score-val { font-weight: 700; }
  .score-bar-track {
    height: 6px; background: var(--bg);
    border-radius: 4px; overflow: hidden;
  }
  .score-bar-fill {
    height: 100%; border-radius: 4px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
  }

  /* ── Table ─────────────────────────────────────────────── */
  .table-wrap { overflow-x: auto; }

  table {
    width: 100%; border-collapse: collapse;
    min-width: 560px;
  }

  thead th {
    padding: 10px 8px;
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 1.5px; color: var(--muted);
    font-weight: 600; border-bottom: 1px solid var(--border);
    text-align: center; white-space: nowrap;
  }
  thead th.left { text-align: left; padding-left: 20px; }

  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:nth-child(even) { background: rgba(13,20,36,0.6); }
  tbody tr:hover { background: var(--surface2); }

  td {
    padding: 9px 8px; text-align: center; vertical-align: middle;
  }
  td.left { text-align: left; padding-left: 20px; }

  .day-name {
    font-family: var(--sans); font-weight: 700;
    font-size: 13px; color: var(--text); letter-spacing: 0.3px;
  }

  /* lift badge */
  .lift-badge {
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    padding: 3px 9px; border-radius: 5px; display: inline-block;
    white-space: nowrap;
  }
  .lift-push   { color: #f97316; background: #f9731618; }
  .lift-pull   { color: #3b8ef0; background: #3b8ef018; }
  .lift-arms   { color: #a78bfa; background: #a78bfa18; }
  .lift-max    { color: #f05252; background: #f0525218; }
  .lift-off    { color: #4a5d7e; background: #4a5d7e18; }

  .cardio-text {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    white-space: nowrap;
  }

  /* checkboxes */
  .cb {
    width: 30px; height: 30px; border-radius: 5px;
    border: 1.5px solid var(--border2); background: transparent;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    font-size: 15px; transition: all 0.15s; outline: none;
    color: transparent;
    -webkit-user-select: none; user-select: none;
  }
  .cb:hover:not(.cb-auto) { border-color: var(--muted); }
  .cb.checked-fast  { background: #38bdf818; border-color: #38bdf8; color: #38bdf8; }
  .cb.checked-lift  { background: var(--accent-lo); border-color: var(--accent); color: var(--accent); }
  .cb.checked-cardio{ background: var(--accent-lo); border-color: var(--accent); color: var(--accent); }
  .cb.checked-g     { background: var(--green-lo);  border-color: var(--green);  color: var(--green); }
  .cb.checked-a     { background: var(--amber-lo);  border-color: var(--amber);  color: var(--amber); }
  .cb.checked-s     { background: var(--purple-lo); border-color: var(--purple); color: var(--purple); }
  .cb.cb-auto       { cursor: default; opacity: 0.45; }

  /* pts cell */
  .pts-cell {
    font-family: var(--mono); font-size: 13px; font-weight: 700;
    min-width: 32px;
  }
  .pts-max  { color: var(--green); }
  .pts-good { color: var(--accent); }
  .pts-low  { color: var(--muted); }

  /* ── Week footer ───────────────────────────────────────── */
  .week-footer {
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
  }
  .footer-field {
    display: flex; align-items: center; gap: 8px;
  }
  .footer-label {
    font-family: var(--mono); font-size: 10px;
    color: var(--muted); letter-spacing: 1.5px; white-space: nowrap;
  }
  .footer-input {
    background: var(--bg); border: 1px solid var(--border2);
    border-radius: 6px; color: var(--text);
    font-family: var(--mono); font-size: 12px;
    padding: 5px 10px; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .footer-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-lo);
  }
  .footer-input::placeholder { color: var(--muted2); }
  .weight-input { width: 80px; }
  .notes-input  { flex: 1; min-width: 180px; }

  /* ── Streak dots ───────────────────────────────────────── */
  .streak-row {
    display: flex; gap: 4px; padding: 10px 20px;
    border-top: 1px solid var(--border);
    align-items: center;
  }
  .streak-label {
    font-family: var(--mono); font-size: 9px; color: var(--muted2);
    letter-spacing: 1.5px; margin-right: 6px; white-space: nowrap;
  }
  .streak-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }

  /* ── Reset btn ─────────────────────────────────────────── */
  #reset-wrap { text-align: center; margin-top: 32px; }
  #reset-btn {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    background: none; border: 1px solid var(--border);
    border-radius: 7px; padding: 7px 18px; cursor: pointer;
    letter-spacing: 1px; transition: all 0.15s; outline: none;
  }
  #reset-btn:hover { border-color: var(--red); color: var(--red); }

  /* ── Scrollbar ─────────────────────────────────────────── */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* ── Responsive ─────────────────────────────────────────── */
  @media (max-width: 600px) {
    .logo-title { font-size: 16px; }
    .overview-grid { grid-template-columns: repeat(3,1fr); }
    .week-header { gap: 12px; }
    .week-date { font-size: 14px; }
  }
</style>
</head>
<body>

<!-- ── Topbar ──────────────────────────────────────────────── -->
<div id="topbar">
  <div id="topbar-inner">
    <div class="logo">
      <span class="logo-title">TRACKER</span>
      <span class="logo-sub">42 DAY PROGRAM</span>
    </div>
    <div class="topbar-right">
      <div class="total-score">TOTAL <span id="total-score-val">0</span> / 252</div>
      <button id="export-btn" onclick="exportCSV()">⬇ CSV</button>
      <div id="save-status">SAVED</div>
    </div>
  </div>
</div>

<div id="root">

  <!-- ── Legend ─────────────────────────────────────────────── -->
  <div class="card" id="legend-card" style="margin-top:20px">
    <div class="legend-inner">
      <div class="legend-item">
        <div class="legend-dot" style="background:#38bdf8"></div>
        <span class="legend-key">FAST</span>
        <span class="legend-desc">Intermittent fasting</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:var(--accent)"></div>
        <span class="legend-key">LIFT ✓</span>
        <span class="legend-desc">Workout done</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:var(--accent)"></div>
        <span class="legend-key">CARDIO ✓</span>
        <span class="legend-desc">Cardio done</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:var(--green)"></div>
        <span class="legend-key">G</span>
        <span class="legend-desc">No gluten</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:var(--amber)"></div>
        <span class="legend-key">A</span>
        <span class="legend-desc">No alcohol</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:var(--purple)"></div>
        <span class="legend-key">S</span>
        <span class="legend-desc">No added sugars</span>
      </div>
      <div class="legend-pts">6 pts/day · 42 pts/week max</div>
    </div>
  </div>

  <!-- ── Overview ───────────────────────────────────────────── -->
  <div class="card" id="overview-card">
    <div class="section-label">6-WEEK OVERVIEW</div>
    <div class="overview-grid" id="overview-grid"></div>
  </div>

  <!-- ── Week tabs ──────────────────────────────────────────── -->
  <div id="week-tabs"></div>

  <!-- ── Week cards ─────────────────────────────────────────── -->
  <div id="weeks-container"></div>

  <!-- ── Reset ──────────────────────────────────────────────── -->
  <div id="reset-wrap">
    <button id="reset-btn" onclick="resetAll()">RESET ALL DATA</button>
  </div>

</div>

<script>
// ── Data ────────────────────────────────────────────────────────────────────
const TEMPLATES = [
  { schedule:[
    {day:"Mon",lift:"Push",  cardio:"Quarters"},
    {day:"Tue",lift:"Pull",  cardio:"Elliptical"},
    {day:"Wed",lift:"Off",   cardio:"Off"},
    {day:"Thu",lift:"Arms",  cardio:"Quarters"},
    {day:"Fri",lift:"Push",  cardio:"Incline"},
    {day:"Sat",lift:"Arms",  cardio:"Off"},
    {day:"Sun",lift:"Pull",  cardio:"Off"},
  ]},
  { schedule:[
    {day:"Mon",lift:"Push",  cardio:"Quarters"},
    {day:"Tue",lift:"Pull",  cardio:"Elliptical"},
    {day:"Wed",lift:"Arms",  cardio:"Off"},
    {day:"Thu",lift:"Off",   cardio:"Quarters"},
    {day:"Fri",lift:"Max",   cardio:"Incline"},
    {day:"Sat",lift:"Arms",  cardio:"Off"},
    {day:"Sun",lift:"Pull",  cardio:"Off"},
  ]},
  { schedule:[
    {day:"Mon",lift:"Push",  cardio:"Quarters"},
    {day:"Tue",lift:"Pull",  cardio:"Elliptical"},
    {day:"Wed",lift:"Off",   cardio:"Off"},
    {day:"Thu",lift:"Arms",  cardio:"Quarters"},
    {day:"Fri",lift:"Push",  cardio:"Incline"},
    {day:"Sat",lift:"Arms",  cardio:"Off"},
    {day:"Sun",lift:"Pull",  cardio:"Off"},
  ]},
  { schedule:[
    {day:"Mon",lift:"Push",  cardio:"Quarters"},
    {day:"Tue",lift:"Pull",  cardio:"Elliptical"},
    {day:"Wed",lift:"Arms",  cardio:"Off"},
    {day:"Thu",lift:"Off",   cardio:"Quarters"},
    {day:"Fri",lift:"Max",   cardio:"Incline"},
    {day:"Sat",lift:"Arms",  cardio:"Off"},
    {day:"Sun",lift:"Pull",  cardio:"Off"},
  ]},
  { schedule:[
    {day:"Mon",lift:"Push",  cardio:"Quarters"},
    {day:"Tue",lift:"Pull",  cardio:"Elliptical"},
    {day:"Wed",lift:"Off",   cardio:"Off"},
    {day:"Thu",lift:"Arms",  cardio:"Quarters"},
    {day:"Fri",lift:"Push",  cardio:"Incline"},
    {day:"Sat",lift:"Arms",  cardio:"Off"},
    {day:"Sun",lift:"Pull",  cardio:"Off"},
  ]},
  { schedule:[
    {day:"Mon",lift:"Push",  cardio:"Quarters"},
    {day:"Tue",lift:"Pull",  cardio:"Elliptical"},
    {day:"Wed",lift:"Arms",  cardio:"Off"},
    {day:"Thu",lift:"Off",   cardio:"Quarters"},
    {day:"Fri",lift:"Max",   cardio:"Incline"},
    {day:"Sat",lift:"Arms",  cardio:"Off"},
    {day:"Sun",lift:"Pull",  cardio:"Off"},
  ]},
];

const STORAGE_KEY = "workout-tracker-v2";

function buildDefault() {
  return TEMPLATES.map((t, wi) => ({
    weight: "",
    notes: "",
    days: t.schedule.map(s => ({
      day: s.day, lift: s.lift, cardio: s.cardio,
      fasting: false, lift_done: false, cardio_done: false,
      G: false, A: false, S: false
    }))
  }));
}

// ── State ────────────────────────────────────────────────────────────────────
let state = { weeks: buildDefault(), activeWeek: 0 }; // activeWeek -1 = all

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      // Merge saved data into fresh template to handle schema changes
      state.weeks = buildDefault().map((w, wi) => {
        const sw = saved.weeks && saved.weeks[wi];
        if (!sw) return w;
        return {
          ...w,
          weight: sw.weight || "",
          notes: sw.notes || "",
          days: w.days.map((d, di) => {
            const sd = sw.days && sw.days[di];
            if (!sd) return d;
            return { ...d, fasting: !!sd.fasting, lift_done: !!sd.lift_done,
              cardio_done: !!sd.cardio_done, G: !!sd.G, A: !!sd.A, S: !!sd.S };
          })
        };
      });
    }
  } catch(e) { console.warn("Load failed", e); }
}

let saveTimer = null;
function save() {
  setSaveStatus("saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
    setSaveStatus("saved");
  }, 600);
}

function setSaveStatus(s) {
  const el = document.getElementById("save-status");
  if (s === "saving") { el.textContent = "SAVING…"; el.className = "saving"; }
  else               { el.textContent = "SAVED";   el.className = ""; }
}

// ── Scoring ──────────────────────────────────────────────────────────────────
function dayScore(day) {
  const liftOff   = day.lift   === "Off";
  const cardioOff = day.cardio === "Off";
  return (day.fasting    ? 1 : 0)
       + (liftOff   || day.lift_done   ? 1 : 0)
       + (cardioOff || day.cardio_done ? 1 : 0)
       + (day.G ? 1 : 0)
       + (day.A ? 1 : 0)
       + (day.S ? 1 : 0);
}
function weekScore(week) { return week.days.reduce((s, d) => s + dayScore(d), 0); }
function totalScore()    { return state.weeks.reduce((s, w) => s + weekScore(w), 0); }

// ── Helpers ──────────────────────────────────────────────────────────────────
function scoreColor(score, max) {
  const p = score / max;
  return p >= 0.8 ? "var(--green)" : p >= 0.55 ? "var(--accent)" : p > 0 ? "var(--red)" : "var(--muted2)";
}

function liftClass(lift) {
  return { Push:"lift-push", Pull:"lift-pull", Arms:"lift-arms",
           Max:"lift-max",   Off:"lift-off" }[lift] || "lift-off";
}

// ── Render ───────────────────────────────────────────────────────────────────
function render() {
  renderTopbar();
  renderOverview();
  renderTabs();
  renderWeeks();
}

function renderTopbar() {
  document.getElementById("total-score-val").textContent = totalScore();
}

function renderOverview() {
  const grid = document.getElementById("overview-grid");
  grid.innerHTML = state.weeks.map((w, i) => {
    const s = weekScore(w);
    const pct = (s / 42 * 100).toFixed(1);
    const col = scoreColor(s, 42);
    return `
      <div class="ov-week">
        <div class="ov-bar-track">
          <div class="ov-bar-fill" style="width:${pct}%;background:${col}"></div>
        </div>
        <div class="ov-label">W${i+1}</div>
        <div class="ov-score" style="color:${col}">${s}</div>
      </div>`;
  }).join("");
}

function renderTabs() {
  const tabs = document.getElementById("week-tabs");
  const allActive = state.activeWeek === -1;
  const tabsHTML = state.weeks.map((w, i) => {
    const s = weekScore(w);
    const active = state.activeWeek === i;
    return `<button class="tab${active ? " active-week" : ""}" onclick="setWeek(${i})">
      W${i+1}<span class="tab-score">${s}</span>
    </button>`;
  }).join("");
  tabs.innerHTML = tabsHTML + `
    <button class="tab${allActive ? " active-all" : ""}" onclick="setWeek(-1)">ALL</button>`;
}

function renderWeeks() {
  const container = document.getElementById("weeks-container");
  const toShow = state.activeWeek === -1
    ? state.weeks.map((_, i) => i)
    : [state.activeWeek];

  container.innerHTML = toShow.map(wi => buildWeekCard(wi)).join("");
}

function buildWeekCard(wi) {
  const week = state.weeks[wi];
  const ws = weekScore(week);
  const col = scoreColor(ws, 42);
  const pct = (ws / 42 * 100).toFixed(1);

  const rows = week.days.map((day, di) => {
    const pts     = dayScore(day);
    const liftOff   = day.lift   === "Off";
    const cardioOff = day.cardio === "Off";
    const ptsClass  = pts === 6 ? "pts-max" : pts >= 4 ? "pts-good" : "pts-low";

    const cbFast   = cb(day.fasting,    "fast",   wi, di, "fasting",    false);
    const cbLift   = cb(liftOff || day.lift_done,   "lift",   wi, di, "lift_done",   liftOff);
    const cbCardio = cb(cardioOff || day.cardio_done,"cardio", wi, di, "cardio_done", cardioOff);
    const cbG      = cb(day.G,  "g",  wi, di, "G",  false);
    const cbA      = cb(day.A,  "a",  wi, di, "A",  false);
    const cbS      = cb(day.S,  "s",  wi, di, "S",  false);

    // Streak dots (fasting, G, A, S for this day)
    return `
    <tr>
      <td class="left"><span class="day-name">${day.day}</span></td>
      <td>${cbFast}</td>
      <td class="left"><span class="lift-badge ${liftClass(day.lift)}">${day.lift}</span></td>
      <td>${cbLift}</td>
      <td class="left"><span class="cardio-text">${day.cardio}</span></td>
      <td>${cbCardio}</td>
      <td>${cbG}</td>
      <td>${cbA}</td>
      <td>${cbS}</td>
      <td><span class="pts-cell ${ptsClass}">${pts}</span></td>
    </tr>`;
  }).join("");

  // Streak bar: show per-category streak dots
  const fastStreak  = week.days.map(d => d.fasting   ? "var(--blue)"   : "var(--muted2)");
  const dietStreak  = week.days.map(d => (d.G && d.A && d.S) ? "var(--green)" : (d.G || d.A || d.S) ? "var(--amber)" : "var(--muted2)");

  const streakFast = fastStreak.map(c => `<div class="streak-dot" style="background:${c}"></div>`).join("");
  const streakDiet = dietStreak.map(c => `<div class="streak-dot" style="background:${c}"></div>`).join("");

  return `
  <div class="card">
    <div class="week-header">
      <div class="week-label-block">
        <div class="week-num">WEEK ${wi+1} OF 6</div>
        <div class="week-date">Days ${wi*7+1}–${wi*7+7}</div>
      </div>
      <div class="score-bar-wrap">
        <div class="score-bar-labels">
          <span>WEEKLY SCORE</span>
          <span class="score-val" style="color:${col}">${ws} / 42</span>
        </div>
        <div class="score-bar-track">
          <div class="score-bar-fill" style="width:${pct}%;background:${col}"></div>
        </div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="left">DAY</th>
            <th style="color:#38bdf8">FAST</th>
            <th class="left">LIFT</th>
            <th>✓</th>
            <th class="left">CARDIO</th>
            <th>✓</th>
            <th style="color:var(--green)">G</th>
            <th style="color:var(--amber)">A</th>
            <th style="color:var(--purple)">S</th>
            <th>PTS</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>

    <div class="streak-row">
      <span class="streak-label">FAST</span>${streakFast}
      <span class="streak-label" style="margin-left:14px">DIET</span>${streakDiet}
    </div>

    <div class="week-footer">
      <div class="footer-field">
        <span class="footer-label">WEIGHT</span>
        <input class="footer-input weight-input" type="text" placeholder="lbs"
          value="${week.weight}"
          onchange="updateField(${wi},'weight',this.value)">
      </div>
      <div class="footer-field" style="flex:1">
        <span class="footer-label">NOTES</span>
        <input class="footer-input notes-input" type="text" placeholder="How did the week go?"
          value="${week.notes}"
          onchange="updateField(${wi},'notes',this.value)">
      </div>
    </div>
  </div>`;
}

function cb(checked, type, wi, di, field, isAuto) {
  const cls = ["cb",
    checked ? `checked-${type}` : "",
    isAuto  ? "cb-auto" : ""
  ].filter(Boolean).join(" ");
  const onclick = isAuto ? "" : `onclick="toggle(${wi},${di},'${field}')"`;
  return `<button class="${cls}" ${onclick}>${checked ? "✕" : ""}</button>`;
}

// ── Actions ──────────────────────────────────────────────────────────────────
function toggle(wi, di, field) {
  state.weeks[wi].days[di][field] = !state.weeks[wi].days[di][field];
  save();
  render();
}

function updateField(wi, field, val) {
  state.weeks[wi][field] = val;
  save();
  renderTopbar();
  renderOverview();
  renderTabs();
}

function setWeek(idx) {
  state.activeWeek = idx;
  renderTabs();
  renderWeeks();
}

function exportCSV() {
  const rows = [
    ["Week","Day #","Day","Lift","Lift Done","Cardio","Cardio Done","Fasting","No Gluten","No Alcohol","No Sugars","Points","Week Score","Weight","Notes"]
  ];

  state.weeks.forEach((week, wi) => {
    const ws = weekScore(week);
    week.days.forEach((day, di) => {
      const liftOff   = day.lift   === "Off";
      const cardioOff = day.cardio === "Off";
      const dayNum    = wi * 7 + di + 1;
      rows.push([
        `Week ${wi+1}`,
        dayNum,
        day.day,
        day.lift,
        liftOff   ? "auto" : (day.lift_done   ? "1" : "0"),
        day.cardio,
        cardioOff ? "auto" : (day.cardio_done ? "1" : "0"),
        day.fasting ? "1" : "0",
        day.G ? "1" : "0",
        day.A ? "1" : "0",
        day.S ? "1" : "0",
        dayScore(day),
        ws,
        di === 0 ? (week.weight || "") : "",
        di === 0 ? (week.notes  || "") : "",
      ]);
    });
  });

  const csv = rows.map(r =>
    r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")
  ).join("\r\n");

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url;
  a.download = "42-day-program.csv";
  a.click();
  URL.revokeObjectURL(url);
}

function resetAll() {
  if (!confirm("Reset all data? This cannot be undone.")) return;
  state.weeks = buildDefault();
  save();
  render();
}

// ── Init ─────────────────────────────────────────────────────────────────────
load();
render();
</script>
</body>
</html>
